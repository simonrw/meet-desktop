<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stub Meet</title>
  </head>
  <body>
    <!--
      Reproduces the Meet DOM hooks and keyboard shortcuts the Meet Bridge relies on:
      - the microphone control, with `data-is-muted` and an aria-label naming the microphone (lobby and call)
      - the camera control, which also carries `data-is-muted`
      - the "Leave call" control (call only)
      - Cmd+D toggling the microphone

      The "Share screen" control (call only) asks for display media as Meet does, and `#share-status` shows the outcome.
    -->
    <main id="screen"></main>
    <p id="share-status">not sharing</p>

    <script>
      const screen = document.getElementById("screen");
      let muted = false;

      const mediaControls = () => `
        <button id="camera" data-is-muted="true" aria-label="Turn on camera">Camera</button>
        <button id="microphone" data-is-muted="${muted}" aria-label="Turn ${muted ? "on" : "off"} microphone">
          Microphone
        </button>
      `;

      const screens = {
        home: () => `<h1>Stub Meet home</h1><button id="new-meeting">New meeting</button>`,
        lobby: () => `<h1>Ready to join?</h1>${mediaControls()}<button id="join">Join now</button>`,
        call: () => `
          <h1>In call</h1>
          ${mediaControls()}
          <button id="share" aria-label="Share screen">Share</button>
          <button id="leave" aria-label="Leave call">Leave</button>
        `,
        left: () => `<h1>You left the meeting</h1><button id="rejoin">Rejoin</button>`,
      };

      let current = "home";

      function show(name) {
        current = name;
        screen.innerHTML = screens[name]();
      }

      function toggleMicrophone() {
        if (current !== "lobby" && current !== "call") {
          return;
        }

        muted = !muted;
        show(current);
      }

      const shareStatus = document.getElementById("share-status");

      async function shareScreen() {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });

          shareStatus.textContent = `sharing ${stream.getVideoTracks()[0].getSettings().displaySurface}`;
        } catch (error) {
          // Meet treats a refused request as a cancelled share and shows nothing.
          shareStatus.textContent = error.name === "NotAllowedError" ? "share cancelled" : `share failed: ${error.name}`;
        }
      }

      const clicks = {
        "new-meeting": () => show("lobby"),
        join: () => show("call"),
        leave: () => show("left"),
        rejoin: () => show("call"),
        microphone: toggleMicrophone,
        share: shareScreen,
      };

      document.addEventListener("click", (event) => clicks[event.target.id]?.());

      document.addEventListener("keydown", (event) => {
        if (event.metaKey && event.keyCode === 68) {
          toggleMicrophone();
        }
      });

      show("home");
    </script>
  </body>
</html>
