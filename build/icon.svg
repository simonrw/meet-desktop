<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3752"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="camera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43F5C4"/>
      <stop offset="1" stop-color="#1E8FFF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#FF8197"/>
      <stop offset="1" stop-color="#F0294F"/>
    </radialGradient>

    <filter id="shadow" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <filter id="glow" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <g id="glyph">
      <rect x="232" y="352" width="424" height="320" rx="84"/>
      <path d="M692 470 L772 412 Q802 391 802 428 L802 596 Q802 633 772 612 L692 554 Z"/>
    </g>
  </defs>

  <!-- The shadow sits on its own layer because filtering the gradient directly bands it. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0B1020" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <use href="#glyph" fill="url(#camera)" opacity=".6" filter="url(#glow)"/>
  <use href="#glyph" fill="url(#camera)"/>
  <use href="#glyph" fill="url(#sheen)"/>

  <circle cx="312" cy="432" r="26" fill="url(#dot)"/>
</svg>
