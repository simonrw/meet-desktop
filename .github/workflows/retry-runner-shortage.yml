name: Retry runner shortage

# When GitHub has no runner for a job it cancels it without running a step, and the whole Release run fails.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A newer run contains this run's commit, and re-running an older one would publish it after the newer one. Re-running
      # keeps the run number, so the stamped version and the draft Release are reused.
      - name: Re-run jobs that never got a runner
        run: |
          newest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ "$newest" != "$RUN_ID" ]; then
            echo "Run $newest is newer, so not re-running $RUN_ID"
            exit 0
          fi

          unstarted="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --jq '[.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0)] | length')"
          if [ "$unstarted" -eq 0 ]; then
            echo "Every job got a runner, so the failure is real"
            exit 0
          fi

          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
