name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queued rather than cancelled, so Releases publish in push order and a half-published Release is never abandoned.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  release:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: npm ci

      - name: Stamp the version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').${GITHUB_RUN_NUMBER}"
          npm version "$version" --no-git-tag-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # electron-builder would otherwise tag whatever main points at when it creates the Release.
      - name: Tag the built commit
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Package, sign and publish
        run: |
          npm run build
          npx electron-builder --mac zip dmg --arm64 --x64 --publish always
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
