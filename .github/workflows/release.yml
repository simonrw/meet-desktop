name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, so Releases publish in push order and a half-published Release is never abandoned. GitHub keeps only
# the newest pending run, which is enough since its commit contains the earlier ones.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  release:
    needs: test
    # A manual run on another branch still tests it, but never publishes it.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: npm ci

      - name: Stamp the version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').${GITHUB_RUN_NUMBER}"
          npm version "$version" --no-git-tag-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # electron-builder uploads both architectures at once, and each creates its own draft if none exists yet. A re-run of
      # the same run number reuses the draft. GitHub's release-by-tag lookup skips drafts, so it's found in the list.
      - name: Create the draft Release
        run: |
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"v$VERSION\") | .id")"
          if [ -z "$existing" ]; then
            gh release create "v$VERSION" --draft --title "$VERSION" --notes "" --target "$GITHUB_SHA"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package, sign and upload
        run: |
          npm run build
          npx electron-builder --mac zip dmg --arm64 --x64 --publish always
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only once every file is uploaded, so installed apps never see a latest Release without latest-mac.yml. Publishing
      # creates the tag on the built commit.
      - name: Publish the Release
        run: gh release edit "v${{ steps.version.outputs.version }}" --draft=false --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
